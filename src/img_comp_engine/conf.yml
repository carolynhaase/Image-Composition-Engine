layers:
  - image: landscape.jpg
    filters:
      - name: gaussianblur
        params:
          window: 11
          sigma: 4.2
  - image: people.jpg
    filters:
      - name: contrast
        params:
          factor: 7
    blend: normal
    opacity: 0.7
  - image: birds.jpg
    filters:
      - name: invert
    blend: multiply
    opacity: 0.32
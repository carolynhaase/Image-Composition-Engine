layers:
  - image: landscape.jpg
    filters:
      - name: gaussianblur
        params:
          window: 11
          sigma: 3.0
  - image: people.jpg
    filters:
      - name: contrast
        params:
          factor: 6
    blend: difference
    opacity: 0.4
  - image: birds.jpg
    filters:
      - name: invert
    blend: multiply
    opacity: 0.32